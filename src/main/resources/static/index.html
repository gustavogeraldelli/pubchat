<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubChat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #030303;
            --shell: rgba(18, 18, 20, 0.68);
            --surface: rgba(24, 24, 27, 0.6);
            --surface-2: rgba(34, 34, 38, 0.44);
            --surface-3: rgba(50, 50, 56, 0.58);
            --field: rgba(10, 10, 12, 0.44);
            --border: rgba(210, 214, 220, 0.18);
            --border-soft: rgba(210, 214, 220, 0.1);
            --text: #f4f4f5;
            --muted: #a7a7ad;
            --faint: #77777f;
            --accent: #d8d8dc;
            --accent-2: #f4f4f5;
            --accent-strong: #ffffff;
            --danger: #ff7777;
            --warning: #c9b878;
            --shadow: 0 28px 90px rgba(0, 0, 0, 0.46);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 34%),
                linear-gradient(180deg, #111113 0%, var(--bg) 58%, #000 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        button,
        input {
            font: inherit;
        }

        button {
            min-height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(24, 24, 27, 0.42);
            color: var(--text);
            cursor: pointer;
            padding: 0 14px;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
        }

        button:hover {
            border-color: rgba(255, 255, 255, 0.34);
            background: rgba(44, 44, 50, 0.62);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button.primary {
            border-color: rgba(255, 255, 255, 0.22);
            background: #e7e7ea;
            color: #09090b;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 28px rgba(0, 0, 0, 0.28);
        }

        button.primary:hover {
            border-color: rgba(255, 255, 255, 0.38);
            background: #d4d4d8;
        }

        button.ghost {
            background: rgba(10, 10, 12, 0.34);
            color: var(--muted);
        }

        input {
            min-height: 42px;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--field);
            color: var(--text);
            padding: 0 12px;
            backdrop-filter: blur(12px);
        }

        input::placeholder {
            color: var(--faint);
        }

        .app-shell {
            width: min(1080px, calc(100vw - 32px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            align-items: center;
            padding: 32px 0;
        }

        .login-view,
        .chat-view {
            width: 100%;
            border: 1px solid var(--border-soft);
            background: var(--shell);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .login-view {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
        }

        .brand {
            display: block;
            margin-bottom: 28px;
        }

        .brand-title {
            margin: 0;
            font-size: 1.3rem;
            line-height: 1.1;
        }

        .brand-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .login-form {
            display: grid;
            gap: 12px;
        }

        .inline-feedback,
        .notice {
            min-height: 22px;
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .inline-feedback.error,
        .notice.error {
            color: var(--danger);
        }

        .inline-feedback.success,
        .notice.success {
            color: #6fe0c1;
        }

        .chat-view {
            min-height: min(760px, calc(100vh - 64px));
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            border-radius: 18px;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(8, 8, 10, 0.24);
            backdrop-filter: blur(14px);
        }

        .room-heading {
            min-width: 0;
        }

        .room-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        #room-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 650;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-meta {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(53, 167, 255, 0.15);
        }

        .room-tools {
            display: grid;
            grid-template-columns: auto minmax(240px, 1fr) auto;
            gap: 10px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(14, 14, 16, 0.22);
            backdrop-filter: blur(14px);
        }

        .join-form {
            display: flex;
            gap: 10px;
            min-width: 0;
        }

        .notice {
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(14, 14, 16, 0.22);
            backdrop-filter: blur(14px);
        }

        .notice:empty {
            display: none;
        }

        .messages {
            min-height: 360px;
            overflow-y: auto;
            padding: 22px 18px;
            background: rgba(4, 4, 5, 0.16);
            backdrop-filter: blur(10px);
        }

        .message {
            max-width: 74%;
            margin: 0 0 12px;
            padding: 11px 13px;
            border: 1px solid var(--border-soft);
            border-radius: 14px 14px 14px 6px;
            background: rgba(32, 32, 36, 0.46);
            backdrop-filter: blur(12px);
            color: var(--text);
            overflow-wrap: anywhere;
        }

        .message.own {
            margin-left: auto;
            border-color: rgba(255, 255, 255, 0.2);
            border-radius: 14px 14px 6px 14px;
            background: rgba(228, 228, 232, 0.16);
        }

        .message.system {
            max-width: 100%;
            margin: 8px 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--faint);
            text-align: center;
            font-size: 0.85rem;
        }

        .message-sender {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 650;
        }

        .message.own .message-sender {
            color: #ffffff;
        }

        .message-text {
            line-height: 1.45;
        }

        .composer-wrap {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--border-soft);
            background: rgba(8, 8, 10, 0.24);
            backdrop-filter: blur(14px);
        }

        .typing {
            min-height: 20px;
            margin-bottom: 10px;
            color: var(--warning);
            font-size: 0.88rem;
        }

        .composer {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 720px) {
            .app-shell {
                width: 100%;
                padding: 0;
            }

            .login-view,
            .chat-view {
                min-height: 100vh;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .room-tools {
                grid-template-columns: 1fr;
            }

            .join-form,
            .composer {
                grid-template-columns: 1fr;
                display: grid;
            }

            .message {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <section id="user-login" class="login-view" aria-labelledby="login-title">
            <div class="brand">
                <div>
                    <h1 id="login-title" class="brand-title">PubChat</h1>
                    <p class="brand-subtitle">Real-time rooms over WebSocket</p>
                </div>
            </div>

            <form id="login-form" class="login-form">
                <label for="sender">Nickname</label>
                <input type="text" id="sender" placeholder="Choose a nickname" autocomplete="off" maxlength="40" required>
                <p id="login-feedback" class="inline-feedback"></p>
                <button id="connect" class="primary" type="submit">Connect</button>
            </form>
        </section>

        <section id="chat-div" class="chat-view" hidden aria-labelledby="room-title">
            <header class="topbar">
                <div class="room-heading">
                    <div class="room-title-row">
                        <span class="status-dot" aria-hidden="true"></span>
                        <h2 id="room-title">Public Chat</h2>
                    </div>
                    <p id="session-meta" class="session-meta"></p>
                </div>
                <button id="disconnect" class="ghost" type="button">Disconnect</button>
            </header>

            <div class="room-tools">
                <button id="create-room" type="button">Create room</button>
                <form id="join-room-form" class="join-form">
                    <input type="text" id="room-id" placeholder="Private room ID" autocomplete="off">
                    <button id="join-room" type="submit">Join</button>
                </form>
                <button id="leave-room" class="ghost" type="button" hidden>Back to global</button>
            </div>

            <p id="notice" class="notice"></p>

            <div id="response" class="messages" aria-live="polite"></div>

            <div class="composer-wrap">
                <div id="is-typing" class="typing"></div>
                <form id="composer-form" class="composer">
                    <input type="text" id="message" placeholder="Write a message..." autocomplete="off" maxlength="500">
                    <button id="send" class="primary" type="submit">Send</button>
                </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
